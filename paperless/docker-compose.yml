services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "Rad8110200881"
    volumes:
      - pgdata:/var/lib/postgresql/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "Rad8110200881"
      PAPERLESS_TIME_ZONE: Asia/Tehran
      PAPERLESS_OCR_LANGUAGE: "fas"
      PAPERLESS_OCR_LANGUAGES: "fas"
      PAPERLESS_OCR_CLEAN: "none"
      PAPERLESS_WORKER_TIMEOUT: 3600
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_URL: http://localhost:8000
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export

  
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # آدرس API پنل Paperless-ngx شما (توجه کنید از نام سرویس webserver استفاده شده، نه localhost)
      - PAPERLESS_AI_PAPERLESS_API_URL=http://webserver:8000
      # توکن API را از تنظیمات Paperless-ngx خود (بخش Profile) بگیرید و اینجا قرار دهید
      - PAPERLESS_AI_API_TOKEN=YOUR_PAPERLESS_API_TOKEN_HERE
      # نام کاربری پنل Paperless-ngx
      - PAPERLESS_AI_USERNAME=admin
      # ارائه‌دهنده هوش مصنوعی (برای شروع، استفاده از Ollama پیشنهاد می‌شود)
      - PAPERLESS_AI_PROVIDER=ollama
      # آدرس Ollama (اگر آن را روی سیستم خود اجرا می‌کنید)
      - PAPERLESS_AI_OLLAMA_API_URL=http://host.docker.internal:11434
      # نام مدلی که در Ollama دانلود کرده‌اید (مثلاً llama3.2)
      - PAPERLESS_AI_OLLAMA_MODEL=llama3.2
    volumes:
      - paperless-ai-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  redisdata:
  pgdata:
  data:
  media:
  paperless-ai-data:
  